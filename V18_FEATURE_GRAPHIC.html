<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>D·A·M·N v18 Feature Graphic</title>
    <style>
        body { margin: 0; background: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        /* EXACT PLAY STORE DIMENSIONS */
        .canvas {
            width: 1024px;
            height: 500px;
            background: #0B1220; /* Brand background */
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }

        /* TEXT SECTION */
        .content {
            padding-left: 80px;
            z-index: 10;
            flex: 1.2;
            pointer-events: none;
        }

        .logo {
            font-size: 130px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 12px;
            margin: 0;
            text-shadow: 0 15px 40px rgba(0,0,0,0.6);
            line-height: 0.9;
        }

        .subtitle {
            font-size: 32px;
            color: #38BDF8; /* Brand accent blue */
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 42px;
            color: #94A3B8;
            font-weight: 300;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        /* MOCKUP SECTION */
        .mockups {
            flex: 1;
            position: relative;
            height: 100%;
        }

        .phone {
            width: 260px;
            height: 560px; /* Taller than canvas to show full height when tilted */
            background: #000;
            border: 12px solid #1E293B;
            border-radius: 44px;
            position: absolute;
            top: -20px;
            overflow: hidden;
            box-shadow: -40px 40px 80px rgba(0,0,0,0.9);
        }

        .phone img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Home Screen Mockup */
        .p1 {
            transform: rotate(-12deg) translateX(-100px) translateY(40px);
            z-index: 1;
            opacity: 0.7;
        }

        /* Dashboard Mockup - Focal Point */
        .p2 {
            transform: rotate(-6deg) translateX(120px) translateY(20px);
            z-index: 2;
            border-color: #38BDF8; /* Accent border on primary mockup */
        }

        /* Glow effects for depth */
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(56,189,248,0.1) 0%, rgba(0,0,0,0) 70%);
            top: -300px;
            right: -200px;
            z-index: 0;
        }

        .accent-flare {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(167,139,250,0.05) 0%, rgba(0,0,0,0) 70%);
            z-index: 0;
        }
    </style>
</head>
<body>

    <div class="canvas">
        <div class="glow"></div>
        <div class="accent-flare"></div>

        <div class="content">
            <h1 class="logo">D·A·M·N</h1>
            <div class="subtitle">Drop Any Media Now</div>
            <div class="tagline">Anonymous Direct Hosting</div>
        </div>

        <div class="mockups">
            <!-- Using your saved .jpg files -->
            <div class="phone p1">
                <img src="screenshot_home.jpg" alt="Home">
            </div>

            <div class="phone p2">
                <img src="screenshot_dashboard.jpg" alt="Dashboard">
            </div>
        </div>
    </div>

</body>
</html>

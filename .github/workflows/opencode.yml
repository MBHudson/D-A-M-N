name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Add other provider keys as needed:
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # only if not using App
        with:
          model: anthropic/claude-sonnet-4-20250514
          # agent: build
          # share: true
          # use_github_token: false # set true if NOT installing GitHub App and using GITHUB_TOKEN instead

# Alternative without GitHub App - uncomment if you prefer GITHUB_TOKEN:
#    permissions:
#      id-token: write
#      contents: write
#      pull-requests: write
#      issues: write
#    env:
#      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#    with:
#      use_github_token: true
